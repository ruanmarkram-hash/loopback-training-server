[project]
name = "training-api"
dynamic = ["version"]
description = "Workout data store and training queue API"
requires-python = ">=3.13"
dependencies = [
    "fastapi[standard]>=0.115",
    "sqlalchemy>=2.0",
    "psycopg[binary]>=3.2",
    "pydantic-settings>=2.0",
    "alembic>=1.14",
    "uvicorn>=0.34",
    "argon2-cffi>=23.1",
    "slowapi>=0.1.9",
]

[project.optional-dependencies]
test = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.version]
path = "app/version.py"

[tool.ruff]
line-length = 120
target-version = "py313"

[tool.pytest.ini_options]
testpaths = ["tests"]

# Security floors from the verified dependency audit. Preserve locked peers.
[tool.uv]
constraint-dependencies = [
    "anyio>=4.14.2",
    "idna>=3.15",
    "mako>=1.4.2",
    "pydantic-settings>=2.14.2",
    "pygments>=2.20.0",
    "python-multipart>=0.0.31",
    "starlette>=1.3.1",
    "urllib3>=2.8.0",
]
